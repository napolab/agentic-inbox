name: Upstream Sync

on:
  schedule:
    # 06:00 JST daily
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Credentials must persist: the sync step pushes the upstream-sync
      # branch to origin with the workflow token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/cloudflare/agentic-inbox.git
          git fetch upstream main

      - name: Count new upstream commits
        id: check
        run: |
          count=$(git rev-list --count HEAD..upstream/main)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "New upstream commits: $count"

      - name: Push sync branch and open PR
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          # This repo is a GitHub fork: without pinning, gh may resolve PR
          # commands to the parent (cloudflare/agentic-inbox) instead.
          GH_REPO: ${{ github.repository }}
          COUNT: ${{ steps.check.outputs.count }}
        run: |
          git push --force origin upstream/main:refs/heads/upstream-sync

          if [ "$(gh pr list --head upstream-sync --state open --json number --jq 'length')" = "0" ]; then
            {
              echo "cloudflare/agentic-inbox に新しいコミットが ${COUNT} 件あります。"
              echo
              echo '```'
              git log --oneline HEAD..upstream/main
              echo '```'
              echo
              echo "コンフリクトがある場合はこの PR 上で手動解決してください。"
            } > pr-body.md
            gh pr create \
              --base main \
              --head upstream-sync \
              --title "Sync with upstream cloudflare/agentic-inbox" \
              --body-file pr-body.md
          else
            echo "Open sync PR already exists; branch updated."
          fi
