name: Upstream Sync

on:
  schedule:
    # 06:00 JST daily
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# This file is byte-identical in napolab/agentic-inbox and every deployment
# that syncs from it; only the UPSTREAM_REPO repository variable differs:
#   napolab/agentic-inbox      UPSTREAM_REPO=cloudflare/agentic-inbox
#   downstream deployments     unset (defaults to napolab/agentic-inbox)
# Keeping it identical means a sync never changes .github/workflows, which the
# workflow token is not allowed to push.
#
# The PR head is main with upstream merged in. Merge sync PRs with a merge
# commit (not squash) so the next run sees the upstream commits as merged.

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'napolab/agentic-inbox' }}
    steps:
      # Credentials must persist: the sync step pushes the upstream-sync
      # branch to origin with the workflow token.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main

      - name: Count new upstream commits
        id: check
        run: |
          count=$(git rev-list --count HEAD..upstream/main)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "New upstream commits from ${UPSTREAM_REPO}: $count"

      - name: Merge upstream into the sync branch and open PR
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          # Pin the repo: in a GitHub fork, gh may otherwise resolve PR
          # commands to the parent repository.
          GH_REPO: ${{ github.repository }}
          COUNT: ${{ steps.check.outputs.count }}
        run: |
          git log --oneline HEAD..upstream/main > "$RUNNER_TEMP/new-commits.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c upstream-sync

          if ! git merge --no-ff --no-edit -m "Merge ${UPSTREAM_REPO} main" upstream/main; then
            git merge --abort
            echo "::error::Merging ${UPSTREAM_REPO} into main conflicts. Merge upstream main on a local branch, resolve the conflicts, and open the PR by hand."
            exit 1
          fi

          if ! git diff --quiet HEAD^1 HEAD -- .github/workflows; then
            echo "::error::${UPSTREAM_REPO} changes .github/workflows, which the workflow token cannot push. Merge upstream main on a local branch and open the PR by hand."
            git diff --stat HEAD^1 HEAD -- .github/workflows
            exit 1
          fi

          git push --force origin upstream-sync

          if [ "$(gh pr list --head upstream-sync --state open --json number --jq 'length')" != "0" ]; then
            echo "Open sync PR already exists; branch updated."
            exit 0
          fi

          {
            echo "${UPSTREAM_REPO} に新しいコミットが ${COUNT} 件あります。"
            echo
            echo '```'
            cat "$RUNNER_TEMP/new-commits.txt"
            echo '```'
            echo
            echo "この PR は main に upstream をマージ済みのブランチです。**merge commit でマージ**してください（squash / rebase だと次回も同じコミットが取り込み対象になります）。"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --base main \
            --head upstream-sync \
            --title "Sync with upstream ${UPSTREAM_REPO}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
